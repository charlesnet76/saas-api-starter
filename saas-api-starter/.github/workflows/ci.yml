name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: saas_test
          POSTGRES_USER: saas_user
          POSTGRES_PASSWORD: saas_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          DATABASE_URL: postgresql://saas_user:saas_password@localhost:5432/saas_test
          JWT_ACCESS_SECRET: test-access-secret-at-least-32-chars
          JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-chars
          NODE_ENV: test
        run: npm test

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Run npm audit
        run: npm audit --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t saas-api-starter:${{ github.sha }} .

      - name: Test Docker image health
        run: |
          docker run -d --name test-container \
            -e DATABASE_URL=postgresql://dummy:dummy@localhost/dummy \
            -e JWT_ACCESS_SECRET=test-secret-32-chars-minimum-here \
            -e JWT_REFRESH_SECRET=test-secret-32-chars-minimum-here \
            -p 3000:3000 \
            saas-api-starter:${{ github.sha }} || true
          echo "Docker build successful"
